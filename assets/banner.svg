<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.25" />
    </filter>

    <!-- Dynamic Styles / Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #8b5cf6); }
      }
      @keyframes pulseNodeGreen {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .node-lead { transform-origin: 785px 180px; animation: pulseNode 3s infinite ease-in-out; }
      .node-rep1 { transform-origin: 1057px 100px; animation: pulseNodeGreen 3.5s infinite ease-in-out 0.5s; }
      .node-rep2 { transform-origin: 1057px 180px; animation: pulseNodeGreen 3.2s infinite ease-in-out 1s; }
      .node-rep3 { transform-origin: 1057px 260px; animation: pulseNodeGreen 3.8s infinite ease-in-out 1.5s; }
      .routing-path { stroke-dasharray: 8 6; animation: flowDash 4s linear infinite; }
      .routing-fast { stroke-dasharray: 6 4; animation: flowDash 2.5s linear infinite; }
      .floating-container { animation: floatSlow 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.07">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#ffffff" stroke-width="1" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Left Content: Typography & Value Prop -->
  <g transform="translate(80, 0)">
    <!-- Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <text x="26" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">REVOPS &amp; GTM ECOSYSTEM</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome <tspan fill="url(#primaryGrad)">Lead Routing</tspan> ⚡
    </text>

    <!-- Tagline -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SDR Assignment • Territory Logic • Round-Robin • Speed-to-Lead
    </text>

    <!-- Key Pills -->
    <g transform="translate(0, 215)">
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">🎯 Match &amp; Route</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="130" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">🔄 Round Robin</text>
      </g>
      <g transform="translate(284, 0)">
        <rect width="140" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">⚡ Instant Booking</text>
      </g>
      <g transform="translate(436, 0)">
        <rect width="118" height="32" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">🌐 Open Source</text>
      </g>
    </g>

    <!-- Sub-footer stats -->
    <text x="0" y="295" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Curated by RevOps &amp; GTM Engineers • SaaS Benchmarks • Open Architecture
    </text>
  </g>

  <!-- Right Visual: Dynamic Lead Routing Graph -->
  <g class="floating-container">
    <!-- Background glow orb -->
    <circle cx="880" cy="180" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

    <!-- Connecting Dynamic Flow Paths -->
    <!-- Inbound to Router -->
    <path d="M 680,180 L 760,180" stroke="#818cf8" stroke-width="3" stroke-linecap="round" class="routing-fast" />

    <!-- Router to Rep 1 -->
    <path d="M 830,180 C 890,180 930,100 1000,100" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" class="routing-path" />
    
    <!-- Router to Rep 2 -->
    <path d="M 830,180 L 1000,180" stroke="url(#primaryGrad)" stroke-width="3" fill="none" class="routing-fast" />
    
    <!-- Router to Rep 3 -->
    <path d="M 830,180 C 890,180 930,260 1000,260" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" class="routing-path" />

    <!-- Inbound Source Node -->
    <g transform="translate(620, 155)">
      <rect width="60" height="50" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="30" y="32" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle">📥</text>
    </g>

    <!-- Central Routing Engine Hub -->
    <g transform="translate(740, 140)" class="node-lead" filter="url(#cardGlow)">
      <rect width="90" height="80" rx="14" fill="#18181b" stroke="#8b5cf6" stroke-width="2" />
      <text x="45" y="38" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" text-anchor="middle">⚡</text>
      <text x="45" y="60" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROUTER</text>
    </g>

    <!-- Destination Rep 1: Enterprise Account Executive -->
    <g transform="translate(990, 75)" class="node-rep1">
      <rect width="135" height="50" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="22" cy="25" r="10" fill="rgba(16, 185, 129, 0.2)" />
      <text x="22" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">👤</text>
      <text x="40" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Enterprise AE</text>
      <text x="40" y="38" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Tier 1 Matched</text>
    </g>

    <!-- Destination Rep 2: Instant Booking Calendar -->
    <g transform="translate(990, 155)" class="node-rep2">
      <rect width="135" height="50" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="22" cy="25" r="10" fill="rgba(236, 72, 153, 0.2)" />
      <text x="22" y="30" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">📅</text>
      <text x="40" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Speed-to-Lead</text>
      <text x="40" y="38" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Instant Demo (0s)</text>
    </g>

    <!-- Destination Rep 3: Mid-Market Round Robin -->
    <g transform="translate(990, 235)" class="node-rep3">
      <rect width="135" height="50" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="22" cy="25" r="10" fill="rgba(59, 130, 246, 0.2)" />
      <text x="22" y="30" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">👥</text>
      <text x="40" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Round Robin</text>
      <text x="40" y="38" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500">Fair Capacity SLA</text>
    </g>
  </g>
</svg>
